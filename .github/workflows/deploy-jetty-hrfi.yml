name: Deploy to jetty without private runner

on:
  workflow_call:
    inputs:
      securitygroup:
        required: true
        type: string
      file:
        required: true
        type: string
      server:
        required: true
        type: string
      instance:
        required: true
        type: string
      context:
        required: true
        type: string
      jdk:
        type: number
        default: 17
      goals:
        type: string
        default: 'clean package'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ inputs.jdk }}
          distribution: 'corretto'
          overwrite-settings: false
      - name: Configure Maven
        run: |
          mkdir -p ~/.m2
          echo "<settings>
                  <servers>
                    <server><id>github</id><username>x-access-token</username><password>${{ secrets.GITHUB_TOKEN }}</password></server>
                    <server><id>github-origin</id><username>x-access-token</username><password>${{ secrets.PACKAGES_TOKEN }}</password></server>
                    <server><id>github-origin-legacy</id><username>x-access-token</username><password>${{ secrets.PACKAGES_TOKEN }}</password></server>
                    <server><id>github-hrfi-v2</id><username>x-access-token</username><password>${{ secrets.PACKAGES_TOKEN }}</password></server>
                    <server><id>github-hrfi-ecvo</id><username>x-access-token</username><password>${{ secrets.PACKAGES_TOKEN }}</password></server>
                    <server><id>github-hrfi-okonomi</id><username>x-access-token</username><password>${{ secrets.PACKAGES_TOKEN }}</password></server>
                  </servers>
                </settings>" > ~/.m2/settings.xml
      - name: Build with Maven
        run: mvn -B -P ${{ inputs.instance }} -Dmaven.test.skip ${{ inputs.goals }}

      - name: Check for GitHub OIDC token
        id: oidc
        run: echo "available=$([ -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ] && echo true || echo false)" >> $GITHUB_OUTPUT
      - name: Configure AWS credentials (OIDC)
        if: steps.oidc.outputs.available == 'true'
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::835337142747:role/github-deploy
          role-session-name: ${{ github.event.repository.name || 'github-actions' }}
          aws-region: eu-north-1
      - name: Configure AWS credentials (access key, deprecated)
        if: steps.oidc.outputs.available != 'true'
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-access-key-id: ${{ secrets.ACTIONS_AWS_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.ACTIONS_AWS_ACCESS_SECRET }}
          aws-region: eu-north-1
      - name: Get runner IP address
        id: ip
        run: echo "ipv4=$(curl -4 -s https://checkip.amazonaws.com)" >> $GITHUB_OUTPUT
      - name: Whitelist runner IP address
        run: |
          aws ec2 authorize-security-group-ingress \
            --group-id ${{ inputs.securitygroup }} \
            --protocol tcp \
            --port 22 \
            --cidr ${{ steps.ip.outputs.ipv4 }}/32

      - name: Deploy to server
        run: | 
          echo "${{ secrets.ACTIONS_SSH_PRIVATE_KEY }}" > private_key && chmod 600 private_key
          scp -o StrictHostKeyChecking=no -i private_key ${{ inputs.file }} actions@${{ inputs.server }}:work/${{ inputs.context }}.war || exit 1
          ssh -o StrictHostKeyChecking=no -i private_key actions@${{ inputs.server }} "~/deploy-jetty work/${{ inputs.context }}.war ${{ inputs.instance }}" || exit 1

      - name: Revoke runner IP address
        if: always() && steps.ip.outputs.ipv4 != ''
        run: |
          aws ec2 revoke-security-group-ingress \
            --group-id ${{ inputs.securitygroup }} \
            --protocol tcp \
            --port 22 \
            --cidr ${{ steps.ip.outputs.ipv4 }}/32
