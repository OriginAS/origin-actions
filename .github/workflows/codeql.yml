name: CodeQL Analysis

# Reusable CodeQL analysis (advanced setup). Callers decide the triggers,
# typically push to the default branch, pull requests and a monthly schedule.
#
# Do not combine with CodeQL "default setup" on the same repository: GitHub
# rejects advanced-setup uploads while default setup is enabled.

on:
  workflow_call:
    inputs:
      jdk:
        description: >-
          Java version the project builds with. Autobuild fails with
          "release version NN not supported" if this is lower than the
          project's release/target level.
        type: number
        default: 11
      disable_kotlin:
        description: >-
          Skip Kotlin extraction. The Java/Kotlin extractor lags behind Kotlin
          releases, and a too-new Kotlin fails the whole analysis
          (KotlinVersionTooRecentError), so Java isn't scanned either. Set to
          true only where that happens, and remove it again once CodeQL catches up.
        type: boolean
        default: false
    secrets:
      PACKAGES_TOKEN:
        # Optional: only needed for projects that resolve packages from
        # GitHub Packages. Dependabot-triggered runs get the Dependabot secret
        # of the same name.
        required: false

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    # Read by ~/.m2/settings.xml (${env.*}) in every Maven call, including
    # autobuild, so the token values never end up in a command line.
    env:
      PACKAGES_TOKEN: ${{ secrets.PACKAGES_TOKEN }}
      MAVEN_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK
        uses: actions/setup-java@v5.7.0
        with:
          distribution: corretto
          java-version: ${{ inputs.jdk }}
          # Without a pom.xml, setup-java fails on `cache: maven`, and then
          # nothing else (JS, Actions) gets scanned either.
          cache: ${{ hashFiles('**/pom.xml') != '' && 'maven' || '' }}
          overwrite-settings: false

      - name: Configure Maven
        if: hashFiles('**/pom.xml') != ''
        # One <server> per repository id that the project's own poms point at
        # maven.pkg.github.com, so no repository names are hardcoded here.
        # Uses PACKAGES_TOKEN when the caller passes it, else GITHUB_TOKEN
        # (enough for the repository's own packages). Passwords stay ${env.*}
        # references; only the ids are printed.
        run: |
          python3 - <<'PY'
          import os, pathlib, xml.etree.ElementTree as ET
          ids = {"github"}
          for pom in pathlib.Path(".").rglob("pom.xml"):
              if {"target", "node_modules"} & set(pom.parts):
                  continue
              try:
                  root = ET.parse(pom).getroot()
              except ET.ParseError:
                  continue
              for el in root.iter():
                  if el.tag.rsplit("}", 1)[-1] not in ("repository", "pluginRepository", "snapshotRepository"):
                      continue
                  kids = {c.tag.rsplit("}", 1)[-1]: (c.text or "").strip() for c in el}
                  if "maven.pkg.github.com" in kids.get("url", "") and kids.get("id"):
                      ids.add(kids["id"])
          pw = "${env.PACKAGES_TOKEN}" if os.environ.get("PACKAGES_TOKEN") else "${env.MAVEN_GITHUB_TOKEN}"
          servers = "".join(
              f"<server><id>{i}</id><username>x-access-token</username><password>{pw}</password></server>"
              for i in sorted(ids)
          )
          m2 = pathlib.Path.home() / ".m2"
          m2.mkdir(parents=True, exist_ok=True)
          (m2 / "settings.xml").write_text(f"<settings><servers>{servers}</servers></settings>\n")
          print("Maven server ids:", ", ".join(sorted(ids)))
          print("Credential:", "PACKAGES_TOKEN" if os.environ.get("PACKAGES_TOKEN") else "GITHUB_TOKEN")
          PY

      - name: Disable Kotlin extraction
        if: inputs.disable_kotlin
        run: echo "CODEQL_EXTRACTOR_JAVA_AGENT_DISABLE_KOTLIN=true" >> "$GITHUB_ENV"

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4.39.1
        with:
          queries: security-extended
          # Autobuild runs before the JS extraction and copies webapp files to
          # target/, so without this every JS finding is reported twice.
          # Doesn't affect Java, which is analysed from the compilation.
          config: |
            paths-ignore:
              - '**/target/**'

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4.39.1

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4.39.1
